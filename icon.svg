  <circle cx="256" cy="256" r="160" fill="none" stroke="#ff2bd6" stroke-width="9" filter="url(#g)"/>
  <g fill="#00e5ff" filter="url(#g2)">
    <circle cx="256" cy="337" r="8" opacity="0.65"/>
    <circle cx="256" cy="365" r="6" opacity="0.38"/>
    <circle cx="256" cy="387" r="4" opacity="0.18"/>
  </g>
  <g filter="url(#g)">
